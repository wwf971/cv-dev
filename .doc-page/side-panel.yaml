# The side panel of the package's doc page: the demonstration first, its design documents below.
sidePanelById:
  main:
    tree:
      - id: cv
        text: cv
        doc: ~cv/doc/README.md
        defaultOpen: true
        children:
          - doc: ~cv/doc/cv-demo.md
          - doc: ~cv/doc/cv-query.md
          - doc: ~cv/doc/cv-jp.md
          - doc: ~cv/doc/cv-badge.md
          # the playground: a document git ignores, made from .doc-page/playground/cv.md; its item
          # stays while the document does not exist, and opens a page offering to create it
          - id: cv-playground
            text: Playground
            doc: ~cv/doc/cv.playground.md
