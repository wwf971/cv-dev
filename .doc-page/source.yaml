# The documents of the package are in doc/; the root is the package folder, as a doc page's is,
# so that .doc-page/object-frontend is named by it. comp-mdx/ of a package is never collected.
rules:
  - action: addFolder
    alias: cv
    path: ..
    collect: recursive
    exclude:
      - doc-package.yaml
      - type.yaml
      - package.json
      - .gitignore
      - .DS_Store
      - temp.md
      # the repository's README, for GitHub; the package's own is doc/README.md
      - /README.md
      # beside the package in this repository, not a document of its doc page
      - vue-legacy/
